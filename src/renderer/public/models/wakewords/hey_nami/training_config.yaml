# hey nami — RACON-hardened (same recipe as hey_nano v1.1).

model_name: hey_nami_cnn_v1
output_dir: ./trained_models
target_phrase: hey nami
positive_data_path: ./data/nami/positive
negative_data_path: ./data/nami/negative
background_paths:
- ./data/background_noise
rir_paths:
- ./data/rir
generate_clips: false
transform_clips: false
train_model: false
distill: false
show_training_summary: true
enable_journaling: true
tts_settings:
  length_scales:
  - 0.9
  - 1.0
  - 1.1
  noise_scales:
  - 0.667
data_generation_tasks:
- name: Positive - hey nami
  enabled: true
  output_dir: ./data/nami/positive
  num_samples: 2000
  file_prefix: pos
  text_source:
    type: fixed_phrase
- name: Negative - common confusables (auto adversarial)
  enabled: true
  output_dir: ./data/nami/negative
  num_samples: 1500
  file_prefix: neg_adv
  text_source:
    type: auto_adversarial
- name: Negative - phoneme adversarial (hard)
  enabled: true
  output_dir: ./data/nami/negative
  num_samples: 1500
  file_prefix: neg_phon
  text_source:
    type: phoneme_adversarial
    min_distance: 0.4
- name: Validation - positive
  enabled: true
  output_dir: ./data/nami/positive_val
  num_samples: 300
  file_prefix: posval
  text_source:
    type: fixed_phrase
- name: Validation - negative
  enabled: true
  output_dir: ./data/nami/negative_val
  num_samples: 400
  file_prefix: negval
  text_source:
    type: auto_adversarial
augmentation_settings:
  gain_prob: 1.0
  min_gain_in_db: -6.0
  max_gain_in_db: 6.0
  pitch_prob: 0.4
  min_pitch_semitones: -2.0
  max_pitch_semitones: 2.0
  min_snr_in_db: 5.0
  max_snr_in_db: 30.0
  rir_prob: 0.0
feature_generation_manifest:
  positive_features:
    input_audio_dirs:
    - ./data/nami/positive
    output_filename: positive_features.npy
    use_background_noise: true
    use_rir: false
    augmentation_rounds: 12
  negative_features:
    input_audio_dirs:
    - ./data/nami/negative
    output_filename: negative_features.npy
    use_background_noise: true
    use_rir: false
    augmentation_rounds: 8
  noise_features:
    input_audio_dirs:
    - ./data/background_noise
    output_filename: noise_features.npy
    use_background_noise: false
    use_rir: false
    augmentation_rounds: 3
  positive_val_features:
    input_audio_dirs:
    - ./data/nami/positive_val
    output_filename: positive_val_features.npy
    use_background_noise: true
    use_rir: false
    augmentation_rounds: 4
  negative_val_features:
    input_audio_dirs:
    - ./data/nami/negative_val
    output_filename: negative_val_features.npy
    use_background_noise: true
    use_rir: false
    augmentation_rounds: 4
feature_manifest:
  targets:
    pos: ./trained_models/hey_nami_cnn_v1/features/positive_features.npy
  negatives:
    hn: ./trained_models/hey_nami_cnn_v1/features/negative_features.npy
    b: ./trained_models/hey_nami_cnn_v1/features/noise_features.npy
    acav: ./data/negatives_acav/acav100m_2000hrs_16bit.npy
    racon: ./data/negatives_racon/racon_train.npy
  targets_val:
    pos: ./trained_models/hey_nami_cnn_v1/features/positive_val_features.npy
  negatives_val:
    hn: ./trained_models/hey_nami_cnn_v1/features/negative_val_features.npy
    racon_val: ./data/negatives_racon/racon_val.npy
    acav_val: ./data/negatives_acav/acav_val_300k.npy
batch_composition:
  pos: 40
  hn: 24
  b: 8
  acav: 24
  racon: 32
model_type: cnn
layer_size: 128
n_blocks: 3
dropout_prob: 0.5
activation_function: relu
embedding_dim: 64
steps: 30000
batch_size: 128
optimizer_type: adamw
lr_scheduler_type: onecycle
weight_decay: 0.01
num_workers: 4
feature_gen_num_workers: 0
validation_batch_size: 256
checkpoint_averaging_top_k: 5
checkpointing:
  enabled: true
  interval_steps: 1000
  limit: 2
early_stopping_patience: 20
main_delta: 0.0001
onnx_opset_version: 17
